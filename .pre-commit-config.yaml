repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff linter
        entry: ruff check --fix --config backend/pyproject.toml
        language: system
        types: [python]
        require_serial: true
      - id: pytest-check
        name: pytest
        entry: bash -c "cd backend && pytest"
        language: system
        pass_filenames: false
        always_run: true