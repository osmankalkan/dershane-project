version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dershane_db
    restart: always
    environment:
      POSTGRES_USER: dershane_user
      POSTGRES_PASSWORD: dershane_password
      POSTGRES_DB: dershane_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dershane_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://dershane_user:dershane_password@db:5432/dershane_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dershane_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  pgdata:
